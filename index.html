<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>货场 1v1 · COD-Lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎯</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <canvas id="screen" width="480" height="270"></canvas>

  <div class="hud">
    <div class="hud-tl">
      <div class="hp">
        <div class="hp-bar"><i id="hpFill"></i></div>
        <span id="hpNum">100</span>
      </div>
    </div>
    <div class="hud-br">
      <div class="wpn" id="wpnName">M4A1</div>
      <div class="ammo"><b id="ammo">30</b><span id="ammoMax">/ 150</span></div>
    </div>
    <div class="hud-tr">
      <span id="fps">-- FPS</span>
      <span id="status">菜单</span>
    </div>
    <div class="hud-tc">
      <div class="timer" id="timer">5:00</div>
      <div class="score"><b id="scoreP">0</b><i>:</i><b id="scoreB">0</b></div>
    </div>
    <div class="hint" id="hint">换弹中…</div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <h1>货场 <span>1v1</span></h1>
      <p class="sub">SHIPMENT · 像素风 · M2 联机</p>
      <div class="diff">
        <button class="chip on" id="modeSolo">单人训练</button>
        <button class="chip" id="modeOnline">联机 1v1</button>
      </div>
      <div class="diff solo-only">
        <button class="chip" data-diff="easy">简单</button>
        <button class="chip on" data-diff="normal">普通</button>
        <button class="chip" data-diff="hard">困难</button>
      </div>
      <div class="online-box hidden" id="onlineBox">
        <input id="roomInput" maxlength="5" placeholder="房间码" autocomplete="off" spellcheck="false">
        <div class="row">
          <button class="btn2" id="createBtn">创建房间</button>
          <button class="btn2" id="joinBtn">加入房间</button>
        </div>
        <div class="net" id="netStatus">输入房间码加入，或创建房间后把码发给对手</div>
        <div class="net hidden" id="shareLink"></div>
      </div>
      <button class="btn primary" id="startBtn">进入训练场</button>
      <div class="keys">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>Shift</kbd> 冲刺</div>
        <div><kbd>空格</kbd> 跳跃 · <kbd>Ctrl</kbd> 蹲/滑铲</div>
        <div><kbd>鼠标</kbd> 转向 · <kbd>左键</kbd> 射击 · <kbd>右键</kbd> 开镜</div>
        <div><kbd>1</kbd>/<kbd>2</kbd> 切枪 · <kbd>R</kbd> 换弹 · <kbd>Esc</kbd> 暂停</div>
        <div class="dim">左下角小地图每 3 秒扫一次，红点是敌人大概位置</div>
      </div>
      <p class="note">单人：对抗 3 个 BOT，先到 25 杀或 5 分钟结束。联机：1v1，房主跑模拟、客机本地预测。</p>
    </div>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="panel small">
      <h2>已暂停</h2>
      <button class="btn primary" id="resumeBtn">继续游戏</button>
      <p class="note">按 Esc 退出指针锁定后会自动暂停</p>
    </div>
  </div>

  <div class="overlay dead hidden" id="dead">
    <div class="deadbox">
      <h2>你被击倒</h2>
      <p id="deadTip">3 秒后重生</p>
    </div>
  </div>

  <div class="overlay hidden" id="result">
    <div class="panel">
      <h1 id="resultTitle">胜利</h1>
      <p class="sub" id="resultSub"></p>
      <button class="btn primary" id="againBtn">再来一局</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/raycast.js"></script>
<script src="js/net-config.js"></script>
<script src="js/netplay.js"></script>
<script src="js/entities.js"></script>
<script src="js/sim.js"></script>
<script src="js/bot.js"></script>
<script src="js/input.js"></script>
<script src="js/hud.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
